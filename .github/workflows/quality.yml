name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)
      - name: JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          php -r 'json_decode(file_get_contents("module.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);'

  javascript-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find tests -name '*.js' -print0)

  licensing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: REUSE lint
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages 'reuse==5.1.0'
          "$HOME/.local/bin/reuse" lint

  ci-required:
    name: ci-required
    if: always()
    needs: [php-lint, javascript-lint, licensing]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs must pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e '
            length == 3 and
            all(.[]; .result == "success")
          ' >/dev/null